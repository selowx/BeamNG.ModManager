[package]
name = "beamng-mod-manager"
version = "0.1.0"
description = "Desktop Mod Manager and Repository Client for BeamNG.drive"
authors = ["BeamNG ModManager"]
edition = "2021"

[lib]
name = "beamng_mod_manager_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "stream", "json", "gzip"] }
scraper = "0.22"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rayon = "1.10"
futures-util = "0.3"
base64 = "0.22"
regex = "1.11"
once_cell = "1.20"
flate2 = "1.0"

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
