name: Windows build

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install MSVC Rust toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
      - uses: ilammy/msvc-dev-cmd@v1
      - run: npm ci
      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Build Windows installers
        run: npm run build:windows -- --ci
      - name: Check runtime dependencies and startup
        shell: pwsh
        run: ./scripts/check-windows-runtime.ps1 -ExePath src-tauri/target/x86_64-pc-windows-msvc/release/beamng-mod-manager.exe
      - name: Upload verified installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
